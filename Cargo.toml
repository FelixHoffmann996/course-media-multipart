[package]
name = "course-media-multipart"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Async multipart uploads with course delivery deadlines and educator reporting"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

